[package]
name = "sallyport"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
# boringtun and smoltcp are built from the copies in vendor. The README
# there says where each is from, and under which license it is.
boringtun = { path = "vendor/boringtun/boringtun", default-features = false }
libc = "0.2"
smoltcp = { path = "vendor/smoltcp", default-features = false, features = [
  "std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic",
  "iface-max-addr-count-8", "iface-max-route-count-2",
] }

[profile.release]
# Keep line tables, so that a panic's backtrace names lines.
debug = 1
