# The workflow runs on a push alone, since a pull request's head is checked
# when it is pushed.
name: check
on: [push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubicloud-standard-2-ubuntu-2404]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        include:
          - {runner: ubicloud-standard-2-arm-ubuntu-2404, ruby: "4.0"}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
  # These tests have another implementation at the other end: Wireproxy,
  # and the Linux kernel behind wireguard-go. Both are built here. A test
  # that cannot run fails in this job, where every one should.
  ring:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubicloud-standard-2-ubuntu-2404, ubicloud-standard-2-arm-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SALLYPORT_NO_SKIP: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - run: bundle exec rake compile fixtures
      - run: bundle exec rake test TEST=test/test_ring.rb
      # The kernel's ring is in a network namespace, which takes root.
      - run: sudo env "PATH=$PATH" SALLYPORT_NO_SKIP=1 ruby -w -Ilib -Itest test/test_kernel.rb
  # VPP is a third WireGuard and a fourth TCP. It is fetched as packages,
  # and it takes root too.
  vpp:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubicloud-standard-2-ubuntu-2404, ubicloud-standard-2-arm-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ethtool libunwind8
      - run: bundle exec rake compile vpp
      - run: sudo env "PATH=$PATH" SALLYPORT_NO_SKIP=1 ruby -w -Ilib -Itest test/test_vpp.rb
  # TLC checks the TLA+ models that are in the source, and a unit test
  # holds the code of an open connection to what TLC says of its model.
  models:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: bundle exec rake tla
      - run: bundle exec rake conform
  # These are the tests that wait for a timer of WireGuard or of TCP to
  # run out.
  slow:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --release --locked --manifest-path ext/sallyport/Cargo.toml -- --ignored
  # These are the tests that smoltcp and boringtun have of their own. The
  # repository changes its copies of the two, in ext/sallyport/vendor.
  # tools/deviations holds each change to the rules of that directory. It
  # reads the commits, so the checkout has them all.
  vendored:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: tools/deviations check
      # Each project has rustfmt check its layout, so a deviation keeps
      # to it, and not to the rustfmt.toml of this library.
      - run: cargo fmt --manifest-path ext/sallyport/vendor/smoltcp/Cargo.toml -- --check --config-path /dev/null
      - run: cargo fmt --all --manifest-path ext/sallyport/vendor/boringtun/Cargo.toml -- --check --config-path /dev/null
      - run: cargo test --lib --manifest-path ext/sallyport/vendor/smoltcp/Cargo.toml --release --locked --target-dir ext/sallyport/target/vendored
      - run: cargo test -p boringtun --manifest-path ext/sallyport/vendor/boringtun/Cargo.toml --release --locked --target-dir ext/sallyport/target/vendored
  lint:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --manifest-path ext/sallyport/Cargo.toml -- --check
      - run: cargo clippy --release --locked --all-targets --manifest-path ext/sallyport/Cargo.toml -- -D warnings
