# The workflow runs on a push alone, since a pull request's head is checked
# when it is pushed.
name: check
on: [push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubicloud-standard-2-ubuntu-2404]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        include:
          - {runner: ubicloud-standard-2-arm-ubuntu-2404, ruby: "4.0"}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
  lint:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --manifest-path ext/sallyport/Cargo.toml -- --check
      - run: cargo clippy --release --locked --all-targets --manifest-path ext/sallyport/Cargo.toml -- -D warnings
